policy:
  # Fail closed: an action without an explicit rule is denied.
  default_decision: deny
  require_approval_for_disruptive_actions: true
  allow_privilege_escalation: false
  # Ngưỡng cảnh báo tài nguyên (Câu 1.1: 90% -> 80%)
  resource_threshold_percent: 80

actions:
  # ===== Rule cũ của nhóm =====
  inspect_system:
    allowed: true
    requires_approval: false

  read_service_logs:
    allowed: true
    requires_approval: false

  restart_service:
    allowed: false
    requires_approval: true

  clean_package_cache:
    allowed: false
    requires_approval: true

  delete_files:
    allowed: false
    requires_approval: true

  # ===== 6 TOOL MỚI CỦA QUỲNH (read-only, allow, no approval) =====

  # 1. ListAllMountsTool (Câu 1.3)
  list_all_mounts:
    allowed: true
    requires_approval: false

  # 2. GetIoStatsTool (Câu 2.3)
  get_io_stats:
    allowed: true
    requires_approval: false

  # 3. ListListeningPortsTool (Câu 1.4)
  list_listening_ports:
    allowed: true
    requires_approval: false

  # 4. GetKernelLogTool (Câu 2.4)
  get_kernel_log:
    allowed: true
    requires_approval: false

  # 5. CheckAuthLogTool (Câu 4.1)
  check_auth_log:
    allowed: true
    requires_approval: false

  # 6. list_top_processes (Câu 1.2 - nâng cấp sort CPU)
  list_top_processes:
    allowed: true
    requires_approval: false
