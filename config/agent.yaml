app:
  name: linux-admin-agent
  version: "0.1.0"

agent:
  # Supported values in the starter foundation: observe, assisted
  mode: observe
  # Keep enabled until policy, approval, executor, and verification are tested.
  dry_run: true
  max_steps: 5
  tool_timeout_seconds: 10

llm:
  # Windows developers and Ubuntu developers can work without an API key.
  enabled: false
  provider: null
  model: null
  # If LLM is enabled later, the real key is read from this environment variable.
  api_key_env: LLM_API_KEY

audit:
  enabled: true
  # Relative paths are resolved from the project root on Windows and Linux.
  database_path: data/audit.db
